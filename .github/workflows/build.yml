name: Build SharpWeb

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Restore NuGet packages
      run: nuget restore SharpWeb.sln

    - name: Build Solution
      run: msbuild SharpWeb.sln /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.0

    - name: Upload Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: SharpWeb-Build
        path: SharpWeb/bin/Release/